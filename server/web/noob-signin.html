<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>NOOB AI · Signing in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><radialGradient id='g' cx='35%' cy='30%'><stop offset='0' stop-color='%2322d3ee'/><stop offset='1' stop-color='%237c5cff'/></radialGradient></defs><circle cx='32' cy='32' r='28' fill='url(%23g)'/></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
<div class="bg-glow"></div>
<div class="card auth-card handoff">
  <div class="orb idle auth-orb small-orb"><div class="orb-core"></div></div>
  <h2 id="title">Signing you in with NOOB…</h2>
  <p class="muted" id="text">One moment.</p>
  <form id="inviteForm" hidden>
    <label class="field"><span>Invite code <small class="muted">(ask the owner of this NOOB AI)</small></span>
      <input id="invite" maxlength="9" placeholder="XXXX-XXXX" autocapitalize="characters"></label>
    <button class="btn primary wide-btn" type="submit">Continue</button>
  </form>
  <a class="btn ghost wide-btn" id="manual" href="/login" hidden>Sign in another way</a>
</div>
<script>
  "use strict";
  // The NOOB social media app hands over its login after '#' (never sent to any server). Read it, remove it
  // from the address bar and history, and let the NOOB AI server check it with NOOB once.
  const $ = (id) => document.getElementById(id);
  const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
  history.replaceState(null, "", "/noob-signin");

  function show(title, text, { invite = false, manual = true } = {}) {
    $("title").textContent = title;
    $("text").textContent = text;
    $("inviteForm").hidden = !invite;
    $("manual").hidden = !manual;
  }

  async function signIn(invite = "") {
    try {
      const r = await fetch("/api/auth/noob-token", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, invite }) });
      const data = await r.json();
      if (data.ok) { location.replace("/app"); return; }
      if (data.needs_invite) show("Welcome to NOOB AI!", data.error, { invite: true });
      else show("Could not sign you in", data.error || "Something went wrong.");
    } catch {
      show("NOOB AI is not reachable", "The NOOB AI server may be switched off. Try again later.");
    }
  }

  $("inviteForm").onsubmit = (e) => { e.preventDefault(); show("Signing you in with NOOB…", "One moment.", { manual: false }); signIn($("invite").value.trim()); };
  if (token) signIn(); else location.replace("/login");
</script>
</body>
</html>
